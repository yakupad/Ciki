name: AileKasa
options:
  bundleIdPrefix: com.yakupad
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_LANGUAGE: tr
    DEVELOPMENT_TEAM: D677J9K7QY
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  AileKasa:
    type: application
    platform: iOS
    sources:
      - AileKasa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.AileKasa
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Çıkı"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Çıkı'yı açarken kimliğinizi doğrulamak için Face ID kullanılır."
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: AileKasa/Info.plist
      properties:
        CKSharingSupported: true
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: AileKasa/AileKasa.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yakupad.AileKasa
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.yakupad.AileKasa
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    dependencies:
      - target: AileKasaWidget
      - target: AileKasaWatch
        platformFilter: iOS

  AileKasaWidget:
    type: app-extension
    platform: iOS
    sources:
      - AileKasaWidget
      - AileKasa/Shared
    info:
      path: AileKasaWidget/Info.plist
      properties:
        CFBundleDisplayName: Çıkı
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AileKasaWidget/AileKasaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yakupad.AileKasa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.AileKasa.Widget
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  AileKasaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - AileKasaWatch
      - AileKasa/Shared
    entitlements:
      path: AileKasaWatch/AileKasaWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yakupad.AileKasa
    dependencies:
      - target: AileKasaWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.AileKasa.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Çıkı"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yakupad.AileKasa
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  AileKasaWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - AileKasaWatchWidget
      - AileKasa/Shared
    info:
      path: AileKasaWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Çıkı
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AileKasaWatchWidget/AileKasaWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yakupad.AileKasa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.AileKasa.watchkitapp.Complications
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  AileKasaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AileKasaTests
    dependencies:
      - target: AileKasa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.AileKasaTests

  AileKasaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AileKasaUITests
    dependencies:
      - target: AileKasa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.AileKasaUITests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  AileKasa:
    build:
      targets:
        AileKasa: all
        AileKasaTests: [test]
        AileKasaUITests: [test]
    test:
      targets:
        - AileKasaTests
        - AileKasaUITests
