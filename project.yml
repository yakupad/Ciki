name: Ciki
options:
  bundleIdPrefix: com.yakupad
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_LANGUAGE: tr
    DEVELOPMENT_TEAM: D677J9K7QY
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Ciki:
    type: application
    platform: iOS
    sources:
      - Ciki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.Ciki
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Çıkı"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Çıkı'yı açarken kimliğinizi doğrulamak için Face ID kullanılır."
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        # App Store yalnızca GM Xcode ile derlenmiş derlemeleri kabul ediyor. iPhone Duo'nun ArrangementView'u
        # 27.1 SDK'sında geldi; 27.0 SDK'sıyla derlenirken Duo düzeni yerine yan yana bölmeler kullanılır.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.0*]": "$(inherited) NO_ARRANGEMENT_VIEW"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.0*]": "$(inherited) NO_ARRANGEMENT_VIEW"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Ciki/Info.plist
      properties:
        CKSharingSupported: true
        # Yalnızca standart HTTPS kullanılıyor (TCMB kurları, iCloud): ihracat beyanı gerekmez.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Ciki/Ciki.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yakupad.Ciki
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.yakupad.Ciki
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        # Mac App Store (Mac Catalyst) için zorunlu sandbox; iOS bu anahtarları yok sayar.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    dependencies:
      - target: CikiWidget
      - target: CikiWatch
        platformFilter: iOS

  CikiWidget:
    type: app-extension
    platform: iOS
    sources:
      - CikiWidget
      - Ciki/Shared
    info:
      path: CikiWidget/Info.plist
      properties:
        CFBundleDisplayName: Çıkı
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CikiWidget/CikiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yakupad.Ciki
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.Ciki.Widget
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  CikiWatch:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - CikiWatch
      - Ciki/Shared
    entitlements:
      path: CikiWatch/CikiWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yakupad.Ciki
    dependencies:
      - target: CikiWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.Ciki.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Çıkı"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yakupad.Ciki
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  CikiWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - CikiWatchWidget
      - Ciki/Shared
    info:
      path: CikiWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Çıkı
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CikiWatchWidget/CikiWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yakupad.Ciki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.Ciki.watchkitapp.Complications
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

  CikiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CikiTests
    dependencies:
      - target: Ciki
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.CikiTests

  CikiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CikiUITests
    dependencies:
      - target: Ciki
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yakupad.CikiUITests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Ciki:
    build:
      targets:
        Ciki: all
        CikiTests: [test]
        CikiUITests: [test]
    test:
      targets:
        - CikiTests
        - CikiUITests
